<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Качалка</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --glass: rgba(255,255,255,.06);
    --glass-2: rgba(255,255,255,.1);
    --stroke: rgba(255,255,255,.1);
    --text: #f2f4f8;
    --soft: #98a1b3;
    --a1: #ff5a5f; --a2: #ff8a5b; --on: #fff;
    --head: "Unbounded", "Arial Black", system-ui, sans-serif;
    --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    min-height: 100vh; color: var(--text); font-family: var(--body);
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
    max-width: 520px; margin: 0 auto; position: relative; overflow-x: hidden;
  }
  /* мягкое свечение цвета дня */
  body::before {
    content: ""; position: fixed; inset: -20% -30% auto -30%; height: 60vh; z-index: -1;
    background: radial-gradient(ellipse at 50% 0%, var(--a1) 0%, transparent 65%);
    opacity: .28; transition: opacity .4s ease; pointer-events: none;
  }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* Зал / Дома */
  .seg {
    position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px;
    background: var(--glass); border: 1px solid var(--stroke); border-radius: 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .seg::before {
    content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
    border-radius: 12px; background: var(--glass-2); box-shadow: 0 2px 10px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.12);
    transition: transform .3s cubic-bezier(.3,1.3,.5,1);
  }
  .seg[data-place="home"]::before { transform: translateX(100%); }
  .seg button { position: relative; padding: 12px 8px; font-weight: 700; font-size: 15px; color: var(--soft); transition: color .2s; }
  .seg button[aria-pressed="true"] { color: var(--text); }

  /* Дни */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 18px 0 16px; }
  .day {
    position: relative; padding: 13px 0 12px; border-radius: 14px; font-weight: 700; font-size: 14px;
    background: var(--glass); border: 1px solid var(--stroke); color: var(--soft);
    transition: transform .2s cubic-bezier(.3,1.4,.5,1), background .2s, color .2s;
  }
  .day[aria-selected="true"] {
    background: linear-gradient(145deg, var(--d1), var(--d2)); color: var(--don);
    border-color: transparent; transform: translateY(-3px);
    box-shadow: 0 8px 22px -6px var(--d1);
  }
  .day i { position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; opacity: .85; }

  /* Карточка дня */
  .hero {
    position: relative; overflow: hidden; border-radius: 24px; padding: 22px 20px;
    background: linear-gradient(145deg, color-mix(in srgb, var(--a1) 30%, transparent), color-mix(in srgb, var(--a2) 8%, transparent));
    border: 1px solid color-mix(in srgb, var(--a1) 40%, transparent);
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .hero h1 { font: 700 24px/1.15 var(--head); letter-spacing: -.01em; }
  .hero p { margin-top: 8px; font-size: 14px; color: color-mix(in srgb, var(--text) 75%, transparent); line-height: 1.35; }
  .ring { position: relative; width: 74px; height: 74px; flex: none; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
  .ring .bg { stroke: rgba(255,255,255,.14); }
  .ring .fg { stroke: url(#g); stroke-dasharray: 188.5; stroke-dashoffset: 188.5; transition: stroke-dashoffset .5s cubic-bezier(.3,1,.4,1); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 600 15px var(--head); }

  /* Упражнения */
  .list { list-style: none; display: grid; gap: 10px; margin-top: 14px; }
  .row {
    width: 100%; display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 14px;
    padding: 14px; text-align: left; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--stroke);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .15s ease, background .2s, border-color .2s;
  }
  .row:active { transform: scale(.98); }
  .dot {
    width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: var(--glass-2); font: 600 14px var(--head); color: var(--soft);
    transition: background .25s, color .25s, transform .3s cubic-bezier(.3,1.6,.5,1);
  }
  .dot svg { width: 20px; height: 20px; display: none; }
  .name { font-weight: 700; font-size: 16px; line-height: 1.25; transition: color .2s; }
  .sets {
    font: 600 13px var(--head); padding: 8px 11px; border-radius: 10px; white-space: nowrap;
    background: rgba(255,255,255,.08); color: var(--text);
  }
  .row[aria-checked="true"] { background: color-mix(in srgb, var(--a1) 12%, transparent); border-color: color-mix(in srgb, var(--a1) 45%, transparent); }
  .row[aria-checked="true"] .dot { background: linear-gradient(145deg, var(--a1), var(--a2)); color: var(--on); transform: scale(1.08); }
  .row[aria-checked="true"] .dot span { display: none; }
  .row[aria-checked="true"] .dot svg { display: block; }
  .row[aria-checked="true"] .name { color: var(--soft); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.3); }

  .foot { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; margin-top: 22px; }
  .reset { color: var(--soft); font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 12px; }
  .reset:hover { background: var(--glass); }

  input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--stroke); background: rgba(255,255,255,.06); color: var(--text); font: 600 16px var(--body); }
  input:focus { outline: 2px solid var(--a1); }
  .erow { display: grid; grid-template-columns: 1fr 86px 42px; gap: 8px; }
  .del { border-radius: 12px; background: rgba(255,90,95,.18); color: #ff8a8f; font-weight: 700; }
  .add { width: 100%; padding: 14px; border-radius: 16px; border: 1px dashed rgba(255,255,255,.25); color: var(--soft); font-weight: 700; }
  .me { width: 100%; display: flex; gap: 14px; align-items: center; text-align: left; padding: 14px; margin-bottom: 16px; border-radius: 22px;
    background: linear-gradient(145deg, rgba(124,58,237,.35), rgba(192,132,252,.08)); border: 1px solid rgba(192,132,252,.45); box-shadow: 0 0 28px -10px #a855f7; }
  .ava { width: 58px; height: 58px; flex: none; border-radius: 16px; background: #2a2146 center/cover; display: grid; place-items: center; font: 700 22px var(--head); border: 2px solid #c084fc; }
  .me-info { flex: 1; min-width: 0; }
  .me-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .me-top b { font: 600 16px var(--head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank { font: 700 13px var(--head); padding: 4px 9px; border-radius: 8px; background: linear-gradient(145deg, #7c3aed, #c084fc); box-shadow: 0 0 14px #a855f7; white-space: nowrap; }
  .me-sub { margin-top: 4px; color: var(--soft); font-size: 13px; font-weight: 600; }
  .xp { height: 8px; border-radius: 4px; background: rgba(255,255,255,.12); margin-top: 10px; overflow: hidden; }
  .xp i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7c3aed, #e879f9); transition: width .5s; }
  .reg { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px 32px; }
  .reg-in { max-width: 520px; margin: 0 auto; display: grid; gap: 12px; }
  .reg h2 { font: 700 26px var(--head); }
  .avapick { display: flex; align-items: center; gap: 14px; font-weight: 700; cursor: pointer; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lab { color: var(--soft); font-weight: 700; font-size: 14px; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 11px 16px; border-radius: 14px; background: var(--glass); border: 1px solid var(--stroke); font-weight: 700; }
  .chip[aria-pressed="true"] { background: linear-gradient(145deg, #7c3aed, #c084fc); border-color: transparent; }
  .go { padding: 16px; border-radius: 16px; background: linear-gradient(145deg, #7c3aed, #c084fc); font: 700 16px var(--head); margin-top: 8px; }
  .start { width: 100%; margin-top: 14px; padding: 16px; border-radius: 16px; background: linear-gradient(145deg, var(--a1), var(--a2)); color: var(--on); font: 700 16px var(--head); }
  .wk-top { display: flex; justify-content: space-between; align-items: center; color: var(--soft); font-weight: 700; }
  .wk h2 { font: 700 32px/1.15 var(--head); margin-top: 28px; }
  .wk-sets { font: 600 20px var(--head); color: var(--a1); }
  .wk-timer { margin-top: 20px; padding: 20px; border-radius: 20px; background: var(--glass); border: 1px solid var(--stroke); text-align: center; }
  .wk-timer b { display: block; font: 700 64px var(--head); }
  .wk-timer span { color: var(--soft); font-weight: 700; }
  .wk-nav { display: grid; grid-template-columns: 60px 1fr 60px; gap: 8px; margin-top: 24px; }
  .wk-nav .chip { font-size: 22px; padding: 0; }
  .wk-nav .go { margin-top: 0; }
  .toprow { display: grid; grid-template-columns: 1fr 54px 54px 54px; gap: 8px; }
  .statbtn { border-radius: 16px; background: var(--glass); border: 1px solid var(--stroke); display: grid; place-items: center; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
  .cards div { padding: 14px 6px; border-radius: 16px; background: var(--glass); border: 1px solid var(--stroke); text-align: center; }
  .cards b { display: block; font: 700 24px var(--head); }
  .cards span { font-size: 12px; color: var(--soft); font-weight: 600; }
  .bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 170px; }
  .bcol { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; }
  .bcol em { font: 600 13px var(--head); font-style: normal; height: 16px; }
  .bcol span { font-size: 13px; font-weight: 700; color: var(--soft); }
  .btrack { position: relative; flex: 1; width: 100%; }
  .btrack i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 8px; min-height: 4px; background: rgba(192,132,252,.4); }
  .btrack i.now { background: linear-gradient(180deg, #e879f9, #7c3aed); box-shadow: 0 0 14px -2px #a855f7; }
  .hint { color: var(--soft); font-size: 12px; text-align: center; }
  .radar { width: 100%; max-width: 320px; margin: 0 auto; display: block; }
  .bal { padding: 18px; border-radius: 20px; text-align: center; background: linear-gradient(145deg, rgba(245,197,66,.25), rgba(245,197,66,.05)); border: 1px solid rgba(245,197,66,.5); }
  .bal b { display: block; font: 700 40px var(--head); color: #f5c542; }
  .bal span { color: var(--soft); font-weight: 700; font-size: 14px; }
  .srow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px; border-radius: 16px; background: var(--glass); border: 1px solid var(--stroke); }
  .srow b { display: block; font-size: 15px; }
  .srow span { font-size: 13px; color: var(--soft); }
  .srow .x { color: var(--soft); padding: 6px 10px; }
  .buy { padding: 10px 14px; border-radius: 12px; background: linear-gradient(145deg, #7c3aed, #c084fc); font: 700 13px var(--head); white-space: nowrap; }
  .buy:disabled { opacity: .4; }
  .buy.on { background: var(--glass-2); }
  .msg { padding: 12px 14px; border-radius: 14px; background: rgba(52,211,153,.15); border: 1px solid rgba(52,211,153,.4); font-weight: 600; font-size: 14px; }
  .start.alt { background: var(--glass); border: 1px solid var(--stroke); color: var(--text); font-size: 14px; margin-top: 8px; }
  .go:disabled { opacity: .4; }
  .lbr { justify-content: flex-start; gap: 12px; }
  .lbr .pl { width: 24px; font: 700 14px var(--head); color: var(--soft); text-align: center; }
  .lbr.me { border-color: #c084fc; background: rgba(168,85,247,.15); }
  .ava.sm { width: 40px; height: 40px; flex: none; border-radius: 12px; font-size: 16px; border-width: 1px; }
  .lbn { flex: 1; min-width: 0; }
  .lbn b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lxp { font: 700 13px var(--head); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<button class="me" id="me" aria-label="Профиль">
  <div class="ava" id="ava"></div>
  <div class="me-info">
    <div class="me-top"><b id="meName"></b><span class="rank" id="rank"></span></div>
    <div class="me-sub" id="meSub"></div>
    <div class="xp"><i id="xpBar"></i></div>
  </div>
</button>

<div class="toprow"><div class="seg" id="seg" data-place="gym" role="group" aria-label="Где тренируешься">
  <button id="gym" aria-pressed="true">Зал</button>
  <button id="home" aria-pressed="false">Дома</button>
</div>
<button class="statbtn" id="statBtn" aria-label="Статистика"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 20V12M12 20V5M18 20v-5"/></svg></button>
<button class="statbtn" id="shopBtn" aria-label="Магазин"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8zM9 8a3 3 0 016 0"/></svg></button>
<button class="statbtn" id="lbBtn" aria-label="Рейтинг"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0V4zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg></button></div>

<div class="days" id="days" role="tablist" aria-label="Дни недели"></div>

<section class="hero">
  <div>
    <h1 id="title"></h1>
    <p id="note"></p>
  </div>
  <div class="ring" aria-hidden="true">
    <svg viewBox="0 0 74 74">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" id="s1" stop-color="#ff5a5f"/><stop offset="1" id="s2" stop-color="#ff8a5b"/>
        </linearGradient>
      </defs>
      <circle class="bg" cx="37" cy="37" r="30"/>
      <circle class="fg" id="fg" cx="37" cy="37" r="30"/>
    </svg>
    <b id="count"></b>
  </div>
</section>

<button class="start" id="startBtn">Начать тренировку</button>
<button class="start alt" id="muBtn">Выбрать мышцы</button>

<ul class="list" id="list"></ul>

<div class="foot"><button class="reset" id="editBtn">Править список</button><button class="reset" id="reset">Сбросить отметки</button><button class="reset" id="restore" hidden>Вернуть стандартный</button></div>

<div class="reg" id="reg" hidden>
  <div class="reg-in">
    <h2>Создай персонажа</h2>
    <label class="avapick"><div class="ava" id="regAva"></div><span>Загрузить фото</span><input type="file" accept="image/*" id="file" hidden></label>
    <input id="fName" placeholder="Имя" maxlength="24">
    <div class="two"><input id="fH" type="number" inputmode="numeric" placeholder="Рост, см"><input id="fW" type="number" inputmode="decimal" placeholder="Вес, кг"></div>
    <p class="lab">Что есть дома</p>
    <div class="chips" id="chips"></div>
    <button class="go" id="go">Начать</button>
  </div>
</div>

<div class="reg wk" id="wk" hidden>
  <div class="reg-in">
    <div class="wk-top"><button class="reset" id="wkClose">Закрыть</button><span id="wkPos"></span></div>
    <h2 id="wkName"></h2>
    <div class="wk-sets" id="wkSets"></div>
    <div class="wk-timer" id="wkTimer" hidden>
      <span>Отдых</span><b id="wkTime">0:00</b>
      <div class="xp"><i id="wkBar"></i></div>
      <button class="reset" id="wkSkip">Пропустить</button>
    </div>
    <div class="wk-nav"><button class="chip" id="wkPrev" aria-label="Назад">←</button><button class="go" id="wkDone">Подход выполнен</button><button class="chip" id="wkNext" aria-label="Дальше">→</button></div>
  </div>
</div>

<div class="reg st" id="st" hidden>
  <div class="reg-in">
    <div class="wk-top"><button class="reset" id="stClose">Закрыть</button><span>Статистика</span></div>
    <div class="reg-in" id="stBody"></div>
  </div>
</div>

<div class="reg sh" id="sh" hidden>
  <div class="reg-in">
    <div class="wk-top"><button class="reset" id="shClose">Закрыть</button><span>Магазин</span></div>
    <div class="reg-in" id="shBody"></div>
  </div>
</div>

<div class="reg mu" id="mu" hidden>
  <div class="reg-in">
    <div class="wk-top"><button class="reset" id="muClose">Закрыть</button><span>Целевые мышцы</span></div>
    <div class="reg-in" id="muBody"></div>
  </div>
</div>

<div class="reg lb" id="lb" hidden>
  <div class="reg-in">
    <div class="wk-top"><button class="reset" id="lbClose">Закрыть</button><span>Рейтинг</span></div>
    <div class="reg-in" id="lbBody"></div>
  </div>
</div>

<script>
// ───────── Данные: день → место → упражнения [название, "подходы × повторы"]
const DAYS = [
  { short: "Пн", c: ["#ff5a5f","#ff8a5b","#fff"], title: "Грудь и трицепс", rest: "Отдых между подходами: 90 сек",
    gym: [["Жим штанги лёжа","4×8"],["Жим гантелей на наклонной","3×10"],["Разводка гантелей","3×12"],["Жим узким хватом","3×10"],["Французский жим","3×12"]],
    home: [["Жим штанги лёжа","4×8","b"],["Отжимания","4×макс"],["Отжимания, ноги на возвышении","3×12"],["Алмазные отжимания","3×10"],["Обратные отжимания от стула","3×12"]] },
  { short: "Вт", c: ["#4c8dff","#6fd0ff","#fff"], title: "Спина и бицепс", rest: "Отдых между подходами: 90 сек",
    gym: [["Подтягивания","4×8"],["Тяга верхнего блока","4×10"],["Тяга штанги в наклоне","3×10"],["Тяга нижнего блока","3×12"],["Сгибания на бицепс со штангой","3×12"]],
    home: [["Подтягивания на турнике","4×макс","t"],["Тяга гантели одной рукой","4×12","d"],["Тяга рюкзака в наклоне","3×12"],["Сгибания с гантелями","3×12","d"],["Супермен","3×15"],["Тяга штанги в наклоне","3×10","b"]] },
  { short: "Ср", c: ["#ffc83d","#ff9f3d","#2a1d00"], title: "Ноги", rest: "Отдых между подходами: 2 мин",
    gym: [["Приседания со штангой","4×8"],["Жим ногами","4×10"],["Румынская тяга","3×10"],["Разгибания ног","3×12"],["Подъём на носки","4×15"]],
    home: [["Приседания","4×20"],["Болгарские выпады","3×12"],["Ягодичный мостик","4×15"],["Выпады вперёд","3×12"],["Подъём на носки","4×20"],["Приседания со штангой","4×8","b"]] },
  { short: "Чт", c: ["#34d399","#8be36b","#06281a"], title: "Плечи и пресс", rest: "Отдых между подходами: 60 сек",
    gym: [["Жим штанги стоя","4×8"],["Махи гантелей в стороны","4×12"],["Махи в наклоне","3×12"],["Шраги","3×12"],["Скручивания","3×15"],["Подъём ног в висе","3×12"]],
    home: [["Жим гантелей стоя","4×10","d"],["Махи гантелей в стороны","3×15","d"],["Отжимания уголком","3×10"],["Планка","3×45 сек"],["Скручивания","3×20"],["Подъём ног лёжа","3×15"]] },

const MN = ["Грудь", "Спина", "Ноги", "Плечи", "Руки", "Пресс"];
const MU = [{ Грудь: .6, Руки: .4 }, { Спина: .65, Руки: .35 }, { Ноги: 1 }, { Плечи: .6, Пресс: .4 }, { Грудь: .5, Спина: .5 }, { Ноги: 1 }, {}];
const fmtD = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
let stMode = "wk";
function stats() {
  const wk = {}, all = {}, perDay = Array(7).fill(0), byDate = {}; let total = 0;
  for (const [key, arr] of Object.entries(done)) {
    if (!key.includes("|") || !arr.length) continue;
    const [w, rest] = key.split("|"), di = +rest.split("-")[1], n = arr.length;
    const [Y, M, D] = w.split("-").map(Number), ds = fmtD(new Date(Y, M - 1, D + di));
    total += n; byDate[ds] = (byDate[ds] || 0) + n;
    if (w === WEEK) perDay[di] += n;
    for (const [m, sh] of Object.entries(MU[di])) { all[m] = (all[m] || 0) + n * sh; if (w === WEEK) wk[m] = (wk[m] || 0) + n * sh; }
  }

  if (!byDate[fmtD(d)]) d.setDate(d.getDate() - 1);
  while (byDate[fmtD(d)]) { streak++; d.setDate(d.getDate() - 1); }

}
function radar(v) {
  const mx = Math.max(...MN.map(m => v[m] || 0), 1), c = 120, R = 78;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
  const ring = k => MN.map((_, i) => pt(i, R * k).join(",")).join(" ");
  const poly = MN.map((m, i) => pt(i, R * Math.max(.04, (v[m] || 0) / mx)).join(",")).join(" ");
  return `<svg class="radar" viewBox="0 0 240 240" role="img" aria-label="Радар мышц">`
    + [.33, .66, 1].map(k => `<polygon points="${ring(k)}" fill="none" stroke="rgba(255,255,255,.14)"/>`).join("")
    + MN.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.1)"/>`; }).join("")
    + `<polygon points="${poly}" fill="rgba(168,85,247,.35)" stroke="#c084fc" stroke-width="2"/>`
    + MN.map((m, i) => { const [x, y] = pt(i, R + 22); return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" fill="#98a1b3" font-size="12" font-weight="700">${m}</text>`; }).join("")
    + `</svg>`;
}

  saveXp(); renderStatus(); renderShop();
});

let muSel = [];
function renderMu() {
  const on = m => muSel.includes(m);
  $("muBody").innerHTML = `
    <p class="lab">Что качаем сегодня?</p>
    <div class="chips">${Object.keys(EX).map(m => `<button class="chip" data-m="${m}" aria-pressed="${on(m)}">${on(m) ? "✓ " : ""}${m}</button>`).join("")}</div>
    <button class="go" id="muGo" ${muSel.length ? "" : "disabled"}>Готово</button>`;
}
function buildMu() {
  const n = muSel.length === 1 ? 5 : muSel.length === 2 ? 3 : 2, home = place === "home", seen = new Set(), out = [];
  for (const m of muSel) {
    const all = EX[m][home ? "h" : "g"];
    let c = all.filter(x => !home || !x[2] || !me || me.eq.includes(x[2]));
    if (!c.length) c = all;
    c.filter(x => !seen.has(x[0])).slice(0, n).forEach(x => { seen.add(x[0]); out.push([x[0], x[1]]); });
  }
  custom[stateKey()] = out; custom[stateKey() + "|t"] = muSel.join(" + ");
  delete done[dk()]; saveCustom(); save(); $("mu").hidden = true; renderDay();
}
$("muBody").addEventListener("click", e => {
  const m = e.target.closest("[data-m]");
  if (m) { const k = m.dataset.m; muSel = muSel.includes(k) ? muSel.filter(x => x !== k) : [...muSel, k]; renderMu(); return; }
  if (e.target.closest("#muGo") && muSel.length) buildMu();
});

const API = "https://gym-rating.daniktv003redmi8.workers.dev"; // ← сюда вставь ссылку на воркер, например https://gym-rating.имя.workers.dev
xp.join = !!xp.join;
let lbScope = "all", lbData = null, lbErr = "", lbT;
const lbSoon = () => { clearTimeout(lbT); lbT = setTimeout(() => lbLoad(true), 4000); };
const lbPost = body => fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
async function lbLoad(silent) {
  const tg = window.Telegram && Telegram.WebApp;
  if (!API) lbErr = "Сервер ещё не подключён.";
  else if (!tg || !tg.initData) lbErr = "Рейтинг работает только внутри Телеграма.";
  else {
    try {
      const r = await lbPost({ initData: tg.initData, xp: xp.total, name: (me && me.name) || "", group: (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "", scope: lbScope });
      if (!r.ok) throw 0;
      lbData = await r.json(); lbErr = "";
    } catch (e) { lbErr = "Не получилось загрузить рейтинг. Попробуй позже."; }
  }
  if (!$("lb").hidden) renderLb();
}
function renderLb() {
  const B = $("lbBody");
  if (!xp.join) {
    B.innerHTML = `<div class="msg">В рейтинге будут видны твоё имя, фото профиля Телеграма и XP. Данные хранятся на сервере. Выйти и удалить их можно в любой момент.</div>
      <button class="go" id="lbJoin">Участвовать</button>`;
    return;
  }
  if (lbErr) { B.innerHTML = `<div class="msg">${esc(lbErr)}</div><button class="reset" id="lbLeave">Выйти из рейтинга</button>`; return; }
  if (!lbData) { B.innerHTML = `<p class="hint">Загрузка…</p>`; return; }
  const rows = lbData.top.map((r, i) => {
    const L = lvl(r.xp).l, ph = r.photo ? `style="background-image:url(${esc(JSON.stringify(r.photo))})"` : "";
    return `<div class="srow lbr${r.id === lbData.me ? " me" : ""}"><span class="pl">${i + 1}</span>
      <div class="ava sm" ${ph}>${r.photo ? "" : esc((r.name || "?").charAt(0).toUpperCase())}</div>
      <div class="lbn"><b>${esc(r.name)}</b><span>Ур. ${L} · ${rank(L)}-ранг</span></div><b class="lxp">${r.xp} XP</b></div>`;
  }).join("");
  B.innerHTML = `
    <div class="chips"><button class="chip" data-sc="all" aria-pressed="${lbScope === "all"}">Все</button>${lbData.mygroup ? `<button class="chip" data-sc="group" aria-pressed="${lbScope === "group"}">Моя группа</button>` : ""}</div>
    ${rows || '<p class="hint">Пока никого нет.</p>'}
    <button class="reset" id="lbLeave">Выйти из рейтинга и удалить данные</button>`;
}
$("lbBody").addEventListener("click", async e => {
  const sc = e.target.closest("[data-sc]");
  if (sc) { lbScope = sc.dataset.sc; await lbLoad(); return; }
  if (e.target.closest("#lbJoin")) { xp.join = true; saveXp(); renderLb(); await lbLoad(); return; }
  if (e.target.closest("#lbLeave")) {
    try { const tg = Telegram.WebApp; if (API && tg.initData) await lbPost({ initData: tg.initData, del: true }); } catch (err) {}
    xp.join = false; lbData = null; lbErr = ""; saveXp(); renderLb();
  }
});
